[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mettle-recovery"
version = "0.1.0"
description = "Deadline-driven failed-inspection recovery for small residential contractors."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.141,<0.142",
  "pydantic>=2.12,<3",
  "strands-agents>=1.51,<2",
  "uvicorn>=0.52,<0.53",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.10,<3",
  "pytest>=9,<10",
]

[project.scripts]
mettle = "mettle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mettle = ["web/static/*", "web/static/evidence/*"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
