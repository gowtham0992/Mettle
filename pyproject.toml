[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mettle-recovery"
version = "0.1.0"
description = "Deadline-driven failed-inspection recovery for small residential contractors."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
  "bedrock-agentcore>=1,<2",
  "boto3>=1.43,<2",
  "botocore[crt]>=1.43,<2",
  "fastapi>=0.141,<0.142",
  "mangum>=0.20,<0.21",
  "pillow>=12.2,<13",
  "pydantic>=2.12,<3",
  "reportlab>=4.4,<5",
  "strands-agents>=1.51,<2",
  "uvicorn>=0.52,<0.53",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.10,<3",
  "pyyaml>=6.0,<7",
  "pytest>=9,<10",
]

[project.scripts]
mettle = "mettle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mettle = ["web/static/*", "web/static/evidence/*"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pdfplumber>=0.11,<0.12",
    "pypdf>=6.9,<7",
]
