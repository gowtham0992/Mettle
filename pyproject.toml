[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mettle-recovery"
version = "0.1.0"
description = "Deadline-driven failed-inspection recovery for small residential contractors."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pydantic>=2.12,<3",
]

[project.optional-dependencies]
aws = [
  "strands-agents>=1.51,<2",
]
dev = [
  "pytest>=9,<10",
]

[project.scripts]
mettle = "mettle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
